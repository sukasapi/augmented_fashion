<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple 3D Test</title>
    
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <!-- GLTFLoader for A-Frame -->
    <script>
        // Wait for A-Frame to be ready
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof AFRAME !== 'undefined') {
                console.log('✅ A-Frame loaded, GLTFLoader should be available');
                
                // Check if GLTFLoader is available
                if (THREE && THREE.GLTFLoader) {
                    console.log('✅ THREE.GLTFLoader is available');
                } else {
                    console.log('⚠️ THREE.GLTFLoader not found, will use A-Frame built-in');
                }
            }
        });
    </script>
    
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #34495e;
            color: white;
        }
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            z-index: 9999;
        }
        
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }
        
        button {
            background: #3498db;
            border: none;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        
        button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">
        Memuat 3D Scene...
    </div>
    
    <div class="info">
        <h3>3D Object Viewer</h3>
        <p id="status">Loading...</p>
        <p><strong>Kontrol Objek:</strong></p>
        <p>• Drag mouse untuk memutar objek 3D</p>
        <p>• Scroll untuk zoom in/out</p>
        <p>• Objek berukuran sesuai layar</p>
    </div>
    
    <a-scene background="color: #34495e">
        <!-- Model Container -->
        <a-entity id="model-container" position="0 0 -3">
            <a-box id="main-model" 
                   position="0 0 0" 
                   rotation="0 45 0" 
                   scale="2 2 2"
                   color="#e74c3c"
                   animation="property: rotation; to: 0 405 0; repeat: indefinite; dur: 4000">
            </a-box>
        </a-entity>
        
        <!-- Camera -->
        <a-entity camera look-controls orbit-controls="target: 0 0 -3; minDistance: 1.5; maxDistance: 8; initialPosition: 0 0 3; enableRotate: false; enableZoom: true; enablePan: false; autoRotate: false; autoRotateSpeed: 0.5; rotateSpeed: 0.5; zoomSpeed: 1.0; panSpeed: 1.0">
        </a-entity>
        
        <!-- Lighting -->
        <a-light type="ambient" color="#404040" intensity="0.4"></a-light>
        <a-light type="directional" position="1 1 1" color="#ffffff" intensity="0.8"></a-light>
        <a-light type="directional" position="-1 1 -1" color="#ffffff" intensity="0.6"></a-light>
        <a-light type="point" position="0 2 -2" color="#ffffff" intensity="0.5"></a-light>
    </a-scene>
    
    <div class="controls">
        <button onclick="loadGLBModel('./asset/model/model.glb')">Figure GLB</button>
        <button onclick="loadGLBModel('./asset/model/walking.glb')">Animasi GLB</button>
    </div>
    
    <div style="position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.8); color: white; padding: 15px; border-radius: 8px; z-index: 1000;">
        <h4>Kamera Controls</h4>
        <p><strong>JARAK:</strong> Scroll mouse untuk zoom</p>
        <p><strong>ROTASI:</strong> Drag mouse untuk melihat sisi objek</p>
        <p><strong>POSISI:</strong> Kamera lurus di depan objek</p>
        <button onclick="resetCamera()" style="margin-top: 5px; padding: 8px 15px; background: #3498db; border: none; color: white; border-radius: 4px; cursor: pointer;">Reset Kamera</button>
        <button onclick="viewBack()" style="margin-top: 5px; padding: 8px 15px; background: #e74c3c; border: none; color: white; border-radius: 4px; cursor: pointer;">Lihat Belakang</button>
        <button onclick="viewFront()" style="margin-top: 5px; padding: 8px 15px; background: #2ecc71; border: none; color: white; border-radius: 4px; cursor: pointer;">Lihat Depan</button>
    </div>

    <script>
        let mainModel;
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Simple 3D Test starting...');
            
            mainModel = document.getElementById('main-model');
            
            // Setup object rotation controls
            setupObjectRotation();
            
            // Ensure camera starts at initial position
            setTimeout(() => {
                resetCamera();
                setupCameraControls();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('status').textContent = 'Ready ✓';
                console.log('✅ 3D Scene loaded with initial camera position');
            }, 1000);
            
            // Reset camera when window gets focus (user comes back to tab)
            window.addEventListener('focus', () => {
                console.log('🔄 Window focused, resetting camera');
                setTimeout(resetCamera, 100);
            });
        });
        
        // Setup object rotation with mouse drag
        function setupObjectRotation() {
            console.log('🎯 Setting up object rotation controls');
            
            let isDragging = false;
            let lastMouseX = 0;
            let lastMouseY = 0;
            let rotationY = 45; // Initial rotation
            let rotationX = 0;
            
            // Mouse events
            document.addEventListener('mousedown', function(e) {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                e.preventDefault();
            });
            
            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                // Rotate object based on mouse movement
                rotationY += deltaX * 0.5;
                rotationX -= deltaY * 0.3; // Limit vertical rotation
                rotationX = Math.max(-45, Math.min(45, rotationX)); // Limit to ±45 degrees
                
                // Apply rotation to the model container
                const modelContainer = document.getElementById('model-container');
                if (modelContainer) {
                    modelContainer.setAttribute('rotation', `${rotationX} ${rotationY} 0`);
                }
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                e.preventDefault();
            });
            
            document.addEventListener('mouseup', function() {
                isDragging = false;
            });
            
            // Touch events for mobile
            document.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    isDragging = true;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                    e.preventDefault();
                }
            });
            
            document.addEventListener('touchmove', function(e) {
                if (!isDragging || e.touches.length !== 1) return;
                
                const deltaX = e.touches[0].clientX - lastMouseX;
                const deltaY = e.touches[0].clientY - lastMouseY;
                
                rotationY += deltaX * 0.5;
                rotationX -= deltaY * 0.3;
                rotationX = Math.max(-45, Math.min(45, rotationX));
                
                const modelContainer = document.getElementById('model-container');
                if (modelContainer) {
                    modelContainer.setAttribute('rotation', `${rotationX} ${rotationY} 0`);
                }
                
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
                e.preventDefault();
            });
            
            document.addEventListener('touchend', function() {
                isDragging = false;
            });
        }
        
        function changeShape(shape) {
            console.log('🔄 Changing to:', shape);
            
            const colors = {
                box: '#e74c3c',
                sphere: '#3498db', 
                cylinder: '#2ecc71',
                cone: '#f39c12'
            };
            
            const newElement = document.createElement('a-' + shape);
            newElement.setAttribute('position', '0 0 0');
            newElement.setAttribute('scale', '2 2 2');
            newElement.setAttribute('color', colors[shape]);
            newElement.setAttribute('animation', 'property: rotation; to: 0 405 0; repeat: indefinite; dur: 4000');
            
            // Replace old model in container
            const modelContainer = document.getElementById('model-container');
            if (modelContainer) {
                modelContainer.innerHTML = '';
                modelContainer.appendChild(newElement);
                mainModel = newElement;
            }
            
            // Update camera target to new object position
            updateCameraTarget();
            
            document.getElementById('status').textContent = 'Shape: ' + shape + ' ✓';
            console.log('✅ Shape changed to:', shape);
        }
        
        function loadGLBModel(src) {
            console.log('📦 Loading GLB model:', src);
            document.getElementById('status').textContent = 'Loading GLB...';
            
            // Test file accessibility first
            fetch(src)
                .then(response => {
                    console.log('📡 Fetch response:', response.status, response.statusText);
                    if (response.ok) {
                        console.log('✅ GLB file accessible');
                        return response.blob();
                    } else {
                        throw new Error('File not accessible: ' + response.status);
                    }
                })
                .then(blob => {
                    console.log('✅ GLB file size:', blob.size, 'bytes');
                    if (blob.size === 0) {
                        throw new Error('File is empty');
                    }
                    
                    // Create GLB entity
                    const gltfEntity = document.createElement('a-entity');
                    gltfEntity.setAttribute('gltf-model', src);
                    gltfEntity.setAttribute('position', '0 0 0');
                    gltfEntity.setAttribute('scale', '2 2 2');
                    gltfEntity.setAttribute('animation', 'property: rotation; to: 0 405 0; repeat: indefinite; dur: 6000');
                    
                    // Success event
                    gltfEntity.addEventListener('model-loaded', (event) => {
                        console.log('✅ GLB model loaded successfully:', event);
                        document.getElementById('status').textContent = 'GLB Loaded ✓';
                    });
                    
                    // Error event
                    gltfEntity.addEventListener('model-error', (error) => {
                        console.error('❌ GLB model failed:', error);
                        document.getElementById('status').textContent = 'GLB Failed - Check Console';
                        loadFallback();
                    });
                    
                    // Replace old model in container
                    const modelContainer = document.getElementById('model-container');
                    if (modelContainer) {
                        modelContainer.innerHTML = '';
                        modelContainer.appendChild(gltfEntity);
                        mainModel = gltfEntity;
                    }
                    
                    // Update camera target to new GLB object position
                    updateCameraTarget();
                    
                    console.log('🔍 GLB entity created and added to scene');
                    
                    // Fallback timeout
                    setTimeout(() => {
                        if (!gltfEntity.object3D.children.length) {
                            console.log('⏰ GLB load timeout, using fallback');
                            loadFallback();
                        } else {
                            console.log('✅ GLB model has children, loading successful');
                        }
                    }, 5000);
                })
                .catch(error => {
                    console.error('❌ GLB file error:', error);
                    document.getElementById('status').textContent = 'File Error - Using Fallback';
                    loadFallback();
                });
        }
        
        function loadFallback() {
            console.log('🔄 Loading fallback box');
            
            const fallbackBox = document.createElement('a-box');
            fallbackBox.setAttribute('position', '0 0 -3');
            fallbackBox.setAttribute('scale', '2 2 2');
            fallbackBox.setAttribute('color', '#e74c3c');
            fallbackBox.setAttribute('animation', 'property: rotation; to: 0 405 0; repeat: indefinite; dur: 4000');
            
            // Replace current model
            mainModel.parentNode.replaceChild(fallbackBox, mainModel);
            mainModel = fallbackBox;
            
            // Update camera target to fallback object position
            updateCameraTarget();
            
            document.getElementById('status').textContent = 'Fallback Loaded ✓';
            console.log('✅ Fallback box loaded');
        }
        
        function updateCameraTarget() {
            console.log('🎯 Updating camera target to current object');
            
            // Get current object position
            const currentModel = document.getElementById('main-model');
            const objectPosition = currentModel ? currentModel.getAttribute('position') : { x: 0, y: 0, z: -3 };
            
            // Update camera orbit controls target
            const camera = document.querySelector('[camera]');
            if (camera) {
                const orbitControls = camera.components['orbit-controls'];
                if (orbitControls) {
                    orbitControls.target.set(objectPosition.x, objectPosition.y, objectPosition.z);
                    console.log('✅ Camera target updated to object position:', objectPosition);
                }
            }
        }
        
        function resetCamera() {
            console.log('🔄 Resetting camera to initial position');
            
            // Get current object position
            const currentModel = document.getElementById('main-model');
            const objectPosition = currentModel ? currentModel.getAttribute('position') : { x: 0, y: 0, z: -3 };
            
            // Reset camera to initial position (facing the object)
            const camera = document.querySelector('[camera]');
            if (camera) {
                // Force reset orbit controls
                const orbitControls = camera.components['orbit-controls'];
                if (orbitControls) {
                    // Calculate camera position directly in front of object
                    const cameraPosition = {
                        x: objectPosition.x,
                        y: objectPosition.y,
                        z: objectPosition.z + 6  // 6 units in front, same height
                    };
                    
                    // Reset to initial position (in front of object)
                    camera.setAttribute('position', cameraPosition);
                    orbitControls.reset();
                    
                    // Update orbit controls settings with object as target
                    camera.setAttribute('orbit-controls', {
                        target: `${objectPosition.x} ${objectPosition.y} ${objectPosition.z}`,
                        minDistance: 1.5,
                        maxDistance: 12,
                        initialPosition: `${cameraPosition.x} ${cameraPosition.y} ${cameraPosition.z}`,
                        enableRotate: true,
                        enableZoom: true,
                        enablePan: false,
                        autoRotate: false,
                        rotateSpeed: 0.5,
                        zoomSpeed: 1.0
                    });
                }
            }
            
            document.getElementById('status').textContent = 'Kamera Reset ✓';
        }
        
        function viewBack() {
            console.log('👀 Moving camera to view back of object');
            
            // Get current object position
            const currentModel = document.getElementById('main-model');
            const objectPosition = currentModel ? currentModel.getAttribute('position') : { x: 0, y: 0, z: -3 };
            
            const camera = document.querySelector('[camera]');
            if (camera) {
                // Position camera behind the object
                const backPosition = {
                    x: objectPosition.x,
                    y: objectPosition.y,
                    z: objectPosition.z - 6  // 6 units behind, same height
                };
                
                camera.setAttribute('position', backPosition);
                camera.setAttribute('orbit-controls', {
                    target: `${objectPosition.x} ${objectPosition.y} ${objectPosition.z}`,
                    minDistance: 1.5,
                    maxDistance: 12
                });
            }
            
            document.getElementById('status').textContent = 'Lihat Belakang ✓';
        }
        
        function viewFront() {
            console.log('👀 Moving camera to view front of object');
            
            // Get current object position
            const currentModel = document.getElementById('main-model');
            const objectPosition = currentModel ? currentModel.getAttribute('position') : { x: 0, y: 0, z: -3 };
            
            const camera = document.querySelector('[camera]');
            if (camera) {
                // Position camera directly in front of the object
                const frontPosition = {
                    x: objectPosition.x,
                    y: objectPosition.y,
                    z: objectPosition.z + 6  // 6 units in front, same height
                };
                
                camera.setAttribute('position', frontPosition);
                camera.setAttribute('orbit-controls', {
                    target: `${objectPosition.x} ${objectPosition.y} ${objectPosition.z}`,
                    minDistance: 1.5,
                    maxDistance: 12
                });
            }
            
            document.getElementById('status').textContent = 'Lihat Depan ✓';
        }
        
        // Add orbit controls change listener to show both front and back
        function setupCameraControls() {
            const camera = document.querySelector('[camera]');
            if (camera) {
                camera.addEventListener('componentchanged', function(evt) {
                    if (evt.detail.name === 'orbit-controls') {
                        const orbitControls = camera.components['orbit-controls'];
                        if (orbitControls && orbitControls.el) {
                            // Adjust camera position to show both front and back
                            const currentPosition = orbitControls.el.getAttribute('position');
                            if (currentPosition) {
                                // Slightly offset the camera to show more of the object
                                const newPosition = {
                                    x: currentPosition.x * 0.9,
                                    y: currentPosition.y,
                                    z: currentPosition.z * 0.9
                                };
                                orbitControls.el.setAttribute('position', newPosition);
                            }
                        }
                    }
                });
            }
        }
        
        console.log('✅ Script loaded');
    </script>
</body>
</html>
