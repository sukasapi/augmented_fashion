<!DOCTYPE html>

    <!-- AR.js CSS - Local -->
    <link rel="stylesheet" href="./build/ar.css" 
          onload="console.log('✅ AR.js CSS local loaded successfully')"
          onerror="loadARCSSBackup()">
    
    <!-- AR.js CSS Backup Function -->
    <script>
        function loadARCSSBackup() {
            console.log('🔄 Loading AR.js CSS backup...');
            
            // Try CDN sources as backup
            const cdnUrls = [
                'https://cdn.jsdelivr.net/npm/ar.js@0.11.0/dist/ar.css',
                'https://unpkg.com/ar.js@0.11.0/dist/ar.css'
            ];
            
            let currentIndex = 0;
            
            function tryCDN() {
                if (currentIndex >= cdnUrls.length) {
                    console.log('⚠️ All AR.js CSS sources failed, using inline fallback');
                    loadFallbackCSS();
                    return;
                }
                
                const url = cdnUrls[currentIndex];
                console.log(`🔄 Trying AR.js CSS ${currentIndex + 1}/${cdnUrls.length}: ${url}`);
                
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = url;
                link.onload = () => console.log(`✅ AR.js CSS loaded successfully: ${url}`);
                link.onerror = () => {
                    currentIndex++;
                    tryCDN();
                };
                document.head.appendChild(link);
            }
            
            tryCDN();
        }
        
        function loadFallbackCSS() {
            console.log('🔧 Loading inline CSS fallback...');
            const style = document.createElement('style');
            style.textContent = `
                /* Essential AR.js styles */
                .arjs-loader {
                    position: absolute;
                    left: 50%;
                    top: 50%;
                    transform: translate(-50%, -50%);
                    font-family: Arial, sans-serif;
                    color: white;
                    background: rgba(0,0,0,0.8);
                    padding: 20px;
                    border-radius: 10px;
                    text-align: center;
                    z-index: 1000;
                }
                
                .arjs-loader div {
                    margin: 10px 0;
                }
                
                .arjs-loader div:after {
                    content: '';
                    animation: arjs-loader-animation 1s infinite;
                }
                
                @keyframes arjs-loader-animation {
                    0% { content: ''; }
                    25% { content: '.'; }
                    50% { content: '..'; }
                    75% { content: '...'; }
                    100% { content: ''; }
                }
                
                /* Basic AR scene styles */
                a-scene {
                    width: 100%;
                    height: 100vh;
                    display: block;
                }
                
                /* Marker styles */
                a-marker {
                    opacity: 0;
                    transition: opacity 0.3s ease;
                }
                
                a-marker.visible {
                    opacity: 1;
                }
                
                /* Entity styles */
                a-entity {
                    display: block;
                }
            `;
            document.head.appendChild(style);
            console.log('✅ Inline CSS fallback loaded successfully');
        }
    </script>
    
    <!-- Three.js - Simplified loading -->
    <script>
        // Simple Three.js check function
        function checkThreeJs() {
            return new Promise((resolve, reject) => {
                console.log('🔍 Checking THREE availability...');
                console.log('THREE type:', typeof THREE);
                console.log('THREE value:', THREE);
                
                if (typeof THREE !== 'undefined') {
                    console.log('✅ THREE is immediately available');
                    resolve(THREE);
                } else {
                    console.log('⏳ THREE not immediately available, waiting...');
                    // Wait a bit for THREE to be available
                    let attempts = 0;
                    const checkInterval = setInterval(() => {
                        attempts++;
                        console.log(`🔍 Check attempt ${attempts}/50, THREE type: ${typeof THREE}`);
                        
                        if (typeof THREE !== 'undefined') {
                            console.log('✅ THREE became available after waiting');
                            clearInterval(checkInterval);
                            resolve(THREE);
                        } else if (attempts > 50) { // Wait up to 5 seconds
                            console.log('❌ THREE still not available after 5 seconds');
                            clearInterval(checkInterval);
                            reject(new Error('Three.js not available'));
                        }
                    }, 100);
                }
            });
        }
    </script>
    
    <!-- Three.js Backup Function -->
    <script>
        function loadThreeJsBackup() {
            console.log('🔄 Loading Three.js backup...');
            
            // Try other local files first
            const localFiles = [
                './build/three.cjs',
                './build/three.core.min.js',
                './build/three.module.min.js'
            ];
            
            let currentIndex = 0;
            
            function tryLocalFile() {
                if (currentIndex >= localFiles.length) {
                    // If all local files fail, try CDN
                    console.log('🌐 All local files failed, trying CDN...');
                    const script = document.createElement('script');
                    script.src = 'https://unpkg.com/three@0.144.0/build/three.min.js';
                    script.onload = () => console.log('✅ Three.js CDN backup loaded successfully');
                    script.onerror = () => console.error('❌ All Three.js sources failed');
                    document.head.appendChild(script);
                    return;
                }
                
                const file = localFiles[currentIndex];
                console.log(`🔄 Trying local backup ${currentIndex + 1}/${localFiles.length}: ${file}`);
                
                const script = document.createElement('script');
                script.src = file;
                script.onload = () => console.log(`✅ Three.js backup loaded successfully: ${file}`);
                script.onerror = () => {
                    currentIndex++;
                    tryLocalFile();
                };
                document.head.appendChild(script);
            }
            
            tryLocalFile();
        }
    </script>

                'https://cdn.jsdelivr.net/npm/ar.js@0.11.0/dist/ar.js',
                'https://unpkg.com/ar.js@0.11.0/dist/ar.js',
                'https://cdnjs.cloudflare.com/ajax/libs/ar.js/0.11.0/ar.js'

            let currentIndex = 0;
            
            function tryCDN() {
                if (currentIndex >= cdnUrls.length) {

                }
                
                const url = cdnUrls[currentIndex];
                console.log(`🔄 Trying AR.js ${currentIndex + 1}/${cdnUrls.length}: ${url}`);
                
                const script = document.createElement('script');
                script.src = url;
                script.onload = () => console.log(`✅ AR.js loaded successfully: ${url}`);
                script.onerror = () => {

    <script>
        // AR Fashion Gallery App
        class ARFashionGallery {
            constructor() {
                this.scene = document.querySelector('#ar-scene');
                this.marker = document.querySelector('#marker');
                this.desktopModel = document.querySelector('#desktop-model');
                this.statusElement = document.getElementById('status');

                this.modeInfoElement = document.getElementById('mode-info');
                this.loadingElement = document.getElementById('loading');
                this.instructionsElement = document.getElementById('instruction-text');
                this.deviceModeElement = document.getElementById('device-mode');
                this.modelCounterElement = document.getElementById('model-counter');
                
                // Debug elements
                console.log('🔍 Scene element:', this.scene);
                console.log('🔍 Desktop model element:', this.desktopModel);
                console.log('🔍 Marker element:', this.marker);

                    },
                    {
                        id: 2,
                        name: "Animasi",
                        type: "glb",
                        src: "./asset/model/walking.glb",
                        thumbnail: "data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2ZmYzYwYyIvPjx0ZXh0IHg9IjUwIiB5PSI1NSIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjEyIiBmaWxsPSJ3aGl0ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+R0xCPC90ZXh0Pjwvc3ZnPg=="
                    }
                ];
                
                this.currentModelIndex = 0;
                this.isMobile = this.detectMobile();
                this.markerDetected = false;
                this.sceneLoaded = false; // Track if scene has loaded
                
                this.init();
            }
            
            setupGLTFLoader() {
                console.log('🔧 Setting up GLTFLoader component');
                
                // Wait for AFRAME to be available
                const setupLoader = () => {
                    if (typeof AFRAME !== 'undefined') {
                        console.log('✅ AFRAME available, checking GLTFLoader');
                        
                        // Check if gltf-model component exists
                        if (!AFRAME.components['gltf-model']) {
                            console.log('🔧 Registering custom gltf-model component');
                            AFRAME.registerComponent('gltf-model', {
                                schema: {
                                    src: {type: 'string'}
                                },
                                init: function () {
                                    console.log('🔧 GLTF component init:', this.data.src);
                                    this.loader = new THREE.GLTFLoader();
                                    this.loadModel();
                                },
                                loadModel: function () {
                                    var self = this;
                                    var src = this.data.src;
                                    
                                    console.log('📦 Loading GLB model:', src);
                                    
                                    if (!src) {
                                        console.error('❌ No src provided for GLB model');
                                        return;
                                    }
                                    
                                    this.loader.load(src, function (gltfModel) {
                                        console.log('✅ GLB model loaded successfully:', src);
                                        self.el.object3D.add(gltfModel.scene);
                                        self.el.emit('model-loaded', {format: 'gltf', model: gltfModel});
                                    }, function (error) {
                                        console.error('❌ GLB model failed to load:', src, error);
                                        self.el.emit('model-error', error);
                                    });
                                }
                            });
                            console.log('✅ Custom GLTFLoader component registered');
                        } else {
                            console.log('✅ GLTFLoader component already available');
                        }
                        
                        // Also check if GLTFLoader is available in THREE
                        if (typeof THREE !== 'undefined' && THREE.GLTFLoader) {
                            console.log('✅ THREE.GLTFLoader is available');
                        } else {
                            console.log('⚠️ THREE.GLTFLoader not available, will use fallback');
                        }
                    } else {
                        console.log('⏳ AFRAME not yet available, retrying...');
                        setTimeout(setupLoader, 100);
                    }
                };
                
                setupLoader();
            }
            
            detectMobile() {
                return /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(navigator.userAgent);
            }
            
            init() {
                console.log('🚀 AR Fashion Gallery App diinisialisasi');
                console.log('📱 Device:', this.isMobile ? 'Mobile' : 'Desktop');
                
                // Set device mode
                this.deviceModeElement.textContent = this.isMobile ? '📱 Mode Mobile' : '💻 Mode Desktop';
                this.modeInfoElement.textContent = this.isMobile ? 'AR dengan Marker' : '3D Viewer';
                
                // Set instructions
                if (this.isMobile) {
                    this.instructionsElement.innerHTML = `
                        <strong>📱 Mode Mobile:</strong><br>
                        1. Download marker dari tombol gallery<br>
                        2. Cetak marker pada kertas putih<br>
                        3. Arahkan kamera ke marker<br>
                        4. Model 3D akan muncul di atas marker
                    `;
                } else {
                    this.instructionsElement.innerHTML = `
                        <strong>💻 Mode Desktop:</strong><br>
                        1. Model 3D langsung tampil tanpa marker<br>
                        2. Gunakan tombol panah untuk ganti model<br>
                        3. Klik gallery untuk lihat koleksi model<br>
                        4. Model akan berputar otomatis
                    `;
                }
                
                // Setup event listeners
                this.setupEventListeners();
                
                // Initialize gallery
                this.initGallery();
                
                // Setup GLTFLoader component
                this.setupGLTFLoader();
                
                // Load initial model dengan fallback untuk desktop
                if (!this.isMobile) {
                    // Fallback untuk desktop jika scene tidak load
                    setTimeout(() => {
                        if (!this.desktopModel.hasChildNodes()) {
                            console.log('🔄 Desktop fallback - loading model');
                            this.loadCurrentModel();
                        }
                    }, 1000);
                }
            }
            
            setupEventListeners() {
                // Scene ready
                this.scene.addEventListener('loaded', () => {
                    console.log('✅ AR Scene berhasil dimuat');
                    this.onSceneReady();
                });
                
                if (this.isMobile) {
                    // Mobile marker events
                    this.marker.addEventListener('markerFound', () => {
                        console.log('🎯 Marker terdeteksi');
                        this.markerDetected = true;
                        this.updateStatus('Marker terdeteksi - Model tampil');
                    });
                    
                    this.marker.addEventListener('markerLost', () => {
                        console.log('❌ Marker hilang');
                        this.markerDetected = false;
                        this.updateStatus('Marker hilang - Arahkan kamera ke marker');
                    });
                } else {
                    // Desktop mode - show model immediately
                    this.scene.addEventListener('loaded', () => {
                        console.log('🖥️ Desktop mode - scene loaded');
                        setTimeout(() => {
                            console.log('🖥️ Desktop mode - loading model after delay');
                            this.loadCurrentModel();
                        }, 500); // Reduced delay
                    });
                    
                // Fallback for desktop mode if scene doesn't load quickly
                setTimeout(() => {
                    if (!this.sceneLoaded) {
                        console.log('🖥️ Desktop mode - scene load timeout, forcing desktop mode');
                        this.forceDesktopMode();
                    }
                }, 1500);
                }
                
                // Handle errors
                this.scene.addEventListener('error', (error) => {
                    console.error('❌ Error AR Scene:', error);
                    this.updateStatus('Error: ' + error.detail);
                });
            }
            
            onSceneReady() {
                console.log('🎉 Scene AR siap digunakan');
                this.sceneLoaded = true; // Mark scene as loaded
                this.hideLoading();
                this.updateStatus(this.isMobile ? 'AR siap - Arahkan kamera ke marker' : '3D Viewer siap');
                this.updateModelInfo(this.models[this.currentModelIndex].name);
                this.updateModelCounter();
                
                // Load model untuk desktop
                if (!this.isMobile) {
                    console.log('🖥️ Desktop mode - loading model immediately');
                    // Add delay to ensure scene is fully ready
                    setTimeout(() => {
                        this.loadCurrentModel();
                    }, 500);
                }
            }
            
            // Fallback method untuk desktop jika scene tidak load
            forceDesktopMode() {
                console.log('🖥️ Force desktop mode - hiding loading and showing model');
                this.hideLoading();
                this.updateStatus('3D Viewer siap (Fallback Mode)');
                this.updateModelInfo(this.models[this.currentModelIndex].name);
                this.updateModelCounter();
                this.loadCurrentModel();
            }
            
            loadCurrentModel() {
                const model = this.models[this.currentModelIndex];
                console.log('📦 Loading model:', model.name);
                console.log('📦 Model type:', model.type);
                console.log('📦 Model src:', model.src);
                
                // Test model file accessibility
                if (model.type === 'glb' && model.src) {
                    this.testModelFile(model.src).catch(error => {
                        console.error('❌ Model file test failed:', error);
                        this.updateStatus('Model file tidak dapat diakses - menggunakan fallback');
                        // Load primitive fallback immediately if file test fails
                        setTimeout(() => {
                            this.loadPrimitiveFallback();
                        }, 100);
                    });
                }
                
                if (this.isMobile) {
                    this.loadMobileModel(model);
                } else {
                    this.loadDesktopModel(model);
                }
            }
            
            testModelFile(src) {
                console.log('🔍 Testing model file accessibility:', src);
                return fetch(src)
                    .then(response => {
                        if (response.ok) {
                            console.log('✅ Model file accessible:', src);
                            return response.blob();
                        } else {
                            console.error('❌ Model file not accessible:', src, 'Status:', response.status);
                            throw new Error(`HTTP ${response.status}`);
                        }
                    })
                    .then(blob => {
                        console.log('✅ Model file size:', blob.size, 'bytes');
                        if (blob.size === 0) {
                            console.error('❌ Model file is empty');
                            throw new Error('Model file is empty');
                        }
                        return blob;
                    })
                    .catch(error => {
                        console.error('❌ Model file fetch error:', src, error);
                        throw error; // Re-throw untuk handling di caller
                    });
            }
            
            loadMobileModel(model) {
                // Clear existing model in marker
                this.marker.innerHTML = '';
                
                if (model.type === 'glb' && model.src) {
                    // Load GLB model dengan syntax yang benar
                    console.log('📱 Loading mobile GLB model:', model.src);
                    
                    // Create GLB model entity
                    const gltfModel = document.createElement('a-entity');
                    gltfModel.setAttribute('gltf-model', model.src);
                    gltfModel.setAttribute('position', '0 0 0');
                    gltfModel.setAttribute('scale', '0.5 0.5 0.5');
                    gltfModel.setAttribute('animation', 'property: rotation; to: 0 360 0; repeat: indefinite; dur: 3000');
                    
                    // Error handling untuk model loading
                    gltfModel.addEventListener('model-loaded', () => {
                        console.log('✅ Mobile GLB model loaded successfully');
                        this.updateStatus('Model GLB berhasil dimuat');
                    });
                    
                    gltfModel.addEventListener('model-error', (error) => {
                        console.error('❌ Mobile GLB model failed to load:', error);
                        // Fallback ke primitive model
                        this.loadPrimitiveFallback();
                    });
                    
                    this.marker.appendChild(gltfModel);
                    
                    // Fallback timeout jika model tidak load dalam 3 detik
                    setTimeout(() => {
                        const gltfElement = this.marker.querySelector('[gltf-model]');
                        if (this.marker.children.length === 0 || !gltfElement || !gltfElement.object3D.children.length) {
                            console.log('⏰ Mobile GLB model load timeout, using fallback');
                            this.loadPrimitiveFallback();
                        }
                    }, 3000);
                    
                } else {
                    // Load primitive model
                    const primitive = this.createPrimitiveModel(model.name);
                    primitive.setAttribute('animation', 'property: rotation; to: 0 360 0; repeat: indefinite; dur: 2000');
                    this.marker.appendChild(primitive);
                }
            }
            
            loadDesktopModel(model) {
                console.log('🖥️ Loading desktop model:', model.name);
                console.log('🔍 Desktop model element before:', this.desktopModel);
                
                // Clear existing model in desktop
                this.desktopModel.innerHTML = '';
                
                if (model.type === 'glb' && model.src) {
                    // Load GLB model dengan syntax yang benar
                    console.log('📦 Loading desktop GLB model:', model.src);
                    
                    // Create GLB model entity
                    const gltfModel = document.createElement('a-entity');
                    gltfModel.setAttribute('gltf-model', model.src);
                    gltfModel.setAttribute('position', '0 0 0');
                    gltfModel.setAttribute('scale', '0.5 0.5 0.5');
                    gltfModel.setAttribute('animation', 'property: rotation; to: 0 360 0; repeat: indefinite; dur: 3000');
                    
                    // Error handling untuk model loading
                    gltfModel.addEventListener('model-loaded', () => {
                        console.log('✅ Desktop GLB model loaded successfully');
                        this.updateStatus('Model GLB berhasil dimuat');
                    });
                    
                    gltfModel.addEventListener('model-error', (error) => {
                        console.error('❌ Desktop GLB model failed to load:', error);
                        // Fallback ke primitive model
                        this.loadPrimitiveFallback();
                    });
                    
                    this.desktopModel.appendChild(gltfModel);
                    console.log('✅ GLB model appended to desktop model');
                    
                    // Fallback timeout jika model tidak load dalam 3 detik
                    setTimeout(() => {
                        const gltfElement = this.desktopModel.querySelector('[gltf-model]');
                        if (this.desktopModel.children.length === 0 || !gltfElement || !gltfElement.object3D.children.length) {
                            console.log('⏰ Desktop GLB model load timeout, using fallback');
                            this.loadPrimitiveFallback();
                        }
                    }, 3000);
                    
                } else {
                    // Load primitive model
                    console.log('🔧 Loading primitive model:', model.name);
                    const primitive = this.createPrimitiveModel(model.name);
                    primitive.setAttribute('animation', 'property: rotation; to: 0 360 0; repeat: indefinite; dur: 2000');
                    this.desktopModel.appendChild(primitive);
                    console.log('✅ Primitive model appended to desktop model');
                }
                
                console.log('🔍 Desktop model element after:', this.desktopModel);
                console.log('🔍 Desktop model children:', this.desktopModel.children);
                
                // Show desktop model with delay to ensure model is loaded
                setTimeout(() => {
                    this.showDesktopModel();
                }, 100);
            }
            
            tryAlternativeGLBLoading(model, mode) {
                console.log(`🔄 Trying alternative GLB loading for ${mode}:`, model.src);
                
                const target = mode === 'mobile' ? this.marker : this.desktopModel;
                target.innerHTML = '';
                
                // Try old a-gltf-model syntax
                try {
                    const oldSyntaxModel = document.createElement('a-gltf-model');
                    oldSyntaxModel.setAttribute('src', model.src);
                    oldSyntaxModel.setAttribute('position', '0 0 0');
                    oldSyntaxModel.setAttribute('scale', '0.5 0.5 0.5');
                    oldSyntaxModel.setAttribute('animation', 'property: rotation; to: 0 360 0; repeat: indefinite; dur: 3000');
                    
                    oldSyntaxModel.addEventListener('model-loaded', () => {
                        console.log(`✅ Alternative GLB model loaded successfully for ${mode}`);
                    });
                    
                    oldSyntaxModel.addEventListener('model-error', (error) => {
                        console.error(`❌ Alternative GLB model failed for ${mode}:`, error);
                        this.loadPrimitiveFallback();
                    });
                    
                    target.appendChild(oldSyntaxModel);
                    console.log(`🔄 Using alternative a-gltf-model syntax for ${mode}`);
                    
                } catch (e) {
                    console.error(`❌ Alternative GLB loading failed for ${mode}:`, e);
                    this.loadPrimitiveFallback();
                }
            }
            
            loadPrimitiveFallback() {
                console.log('🔄 Loading primitive fallback model');
                const primitive = this.createPrimitiveModel('Box 3D');
                primitive.setAttribute('animation', 'property: rotation; to: 0 360 0; repeat: indefinite; dur: 2000');
                
                if (this.isMobile) {
                    this.marker.innerHTML = '';
                    this.marker.appendChild(primitive);
                    console.log('✅ Primitive fallback loaded for mobile');
                } else {
                    this.desktopModel.innerHTML = '';
                    this.desktopModel.appendChild(primitive);
                    this.showDesktopModel();
                    console.log('✅ Primitive fallback loaded for desktop');
                }
                
                this.updateStatus('Model GLB gagal - menggunakan model fallback');
                this.updateModelInfo('Box 3D (Fallback)');
            }
            
            createPrimitiveModel(modelName) {
                console.log('🔧 Creating primitive model:', modelName);
                let primitive;
                
                switch(modelName) {
                    case 'Box 3D':
                        primitive = document.createElement('a-box');
                        primitive.setAttribute('position', '0 0.5 0');
                        primitive.setAttribute('material', 'color: #ff6b6b; opacity: 0.8');
                        console.log('📦 Created box primitive');
                        break;
                    case 'Sphere 3D':
                        primitive = document.createElement('a-sphere');
                        primitive.setAttribute('position', '0 0.5 0');
                        primitive.setAttribute('material', 'color: #3742fa; opacity: 0.8');
                        console.log('🔵 Created sphere primitive');
                        break;
                    case 'Cylinder 3D':
                        primitive = document.createElement('a-cylinder');
                        primitive.setAttribute('position', '0 0.5 0');
                        primitive.setAttribute('material', 'color: #2dd34c; opacity: 0.8');
                        console.log('🔄 Created cylinder primitive');
                        break;
                    case 'Cone 3D':
                        primitive = document.createElement('a-cone');
                        primitive.setAttribute('position', '0 0.5 0');
                        primitive.setAttribute('material', 'color: #ee5a24; opacity: 0.8');
                        console.log('🔺 Created cone primitive');
                        break;
                    default:
                        primitive = document.createElement('a-box');
                        primitive.setAttribute('position', '0 0.5 0');
                        primitive.setAttribute('material', 'color: #ff6b6b; opacity: 0.8');
                        console.log('📦 Created default box primitive');
                }
                
                console.log('✅ Primitive model created:', primitive);
                return primitive;
            }
            
            showDesktopModel() {
                console.log('👁️ Showing desktop model');
                this.desktopModel.setAttribute('visible', 'true');
                this.updateStatus('Model 3D tampil - Gunakan navigasi untuk ganti model');
                console.log('✅ Desktop model visibility set to true');
                
                // Debug: Check if model has children
                console.log('🔍 Desktop model children count:', this.desktopModel.children.length);
                console.log('🔍 Desktop model innerHTML:', this.desktopModel.innerHTML);
                
                // Force show model even if no children
                if (this.desktopModel.children.length === 0) {
                    console.log('⚠️ No children in desktop model, loading fallback');
                    this.loadPrimitiveFallback();
                }
            }
            
            initGallery() {
                const galleryGrid = document.getElementById('gallery-grid');
                galleryGrid.innerHTML = '';
                
                this.models.forEach((model, index) => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    if (index === this.currentModelIndex) {
                        item.classList.add('active');
                    }
                    
                    item.innerHTML = `
                        <img src="${model.thumbnail}" alt="${model.name}">
                        <h4>${model.name}</h4>
                        <p>${model.type === 'glb' ? 'Model GLB' : 'Primitive'}</p>
                    `;
                    
                    item.onclick = () => this.selectModel(index);
                    galleryGrid.appendChild(item);
                });
            }
            
            selectModel(index) {
                this.currentModelIndex = index;
                this.loadCurrentModel();
                this.updateModelInfo(this.models[this.currentModelIndex].name);
                this.updateModelCounter();
                this.initGallery(); // Refresh gallery to show active state
                closeGallery();
            }
            
            previousModel() {
                this.currentModelIndex = (this.currentModelIndex - 1 + this.models.length) % this.models.length;
                this.loadCurrentModel();
                this.updateModelInfo(this.models[this.currentModelIndex].name);
                this.updateModelCounter();
                this.initGallery();
            }
            
            nextModel() {
                this.currentModelIndex = (this.currentModelIndex + 1) % this.models.length;
                this.loadCurrentModel();
                this.updateModelInfo(this.models[this.currentModelIndex].name);
                this.updateModelCounter();
                this.initGallery();
            }
            
            updateStatus(message) {
                this.statusElement.textContent = message;
                console.log('📊 Status:', message);
            }
            
            updateModelInfo(info) {
                this.modelInfoElement.textContent = info;
            }
            
            updateModelCounter() {
                this.modelCounterElement.textContent = `${this.currentModelIndex + 1} / ${this.models.length}`;
            }
            
            hideLoading() {
                this.loadingElement.style.display = 'none';
            }
        }
        
        // Global functions
        let app;
        
        function previousModel() {
            if (app) app.previousModel();
        }
        
        function nextModel() {
            if (app) app.nextModel();
        }
        
        function openGallery() {
            document.getElementById('gallery-modal').style.display = 'block';
        }
        
        function closeGallery() {
            document.getElementById('gallery-modal').style.display = 'none';
        }
        
        // Initialize app function
        function initializeApp() {
            console.log('🎬 Initializing AR Fashion Gallery...');
            
            if (typeof THREE !== 'undefined') {
                console.log('📦 Three.js version:', THREE.REVISION);
                console.log('✅ Three.js loaded successfully - no deprecation warnings expected');
                app = new ARFashionGallery();
            } else {
                console.error('❌ Three.js not available');
            }
        }
        
        // Flag to prevent multiple initialization
        let appInitialized = false;
        
        // Initialize app with Three.js loading
        async function initializeAppWithThree() {
            // Prevent multiple initialization
            if (appInitialized) {
                console.log('⚠️ App already initialized, skipping...');
                return;
            }
            
            try {
                console.log('🎬 DOM ready, checking Three.js...');
                
                // Wait for THREE to be available
                await checkThreeJs();
                console.log('✅ Three.js is available');
                
                appInitialized = true;
                initializeApp();
                
                // Fallback: Hide loading screen after timeout if scene doesn't load
                setTimeout(() => {
                    const loadingElement = document.getElementById('loading');
                    if (loadingElement && loadingElement.style.display !== 'none') {
                        console.log('⚠️ Loading screen still visible after 3 seconds, forcing hide');
                        loadingElement.style.display = 'none';
                        
                        // Try to show desktop model if on desktop
                        if (app && !app.isMobile) {
                            console.log('🖥️ Desktop fallback - forcing model load');
                            app.forceDesktopMode();
                        }
                    }
                }, 2000);
                
                // Early fallback for desktop mode
                if (app && !app.isMobile) {
                    setTimeout(() => {
                        if (!app.sceneLoaded) {
                            console.log('🖥️ Early desktop fallback - scene not loaded in 1 second');
                            app.forceDesktopMode();
                        }
                    }, 1000);
                }
                
            } catch (error) {
                console.error('❌ Three.js not available:', error);
                
                // Last resort: use simplified Three.js
                console.log('🔧 Using simplified Three.js as last resort...');
                createSimplifiedThreeJs();
                
                try {
                    appInitialized = true;
                    initializeApp();
                    console.log('✅ App initialized with simplified Three.js');
                } catch (initError) {
                    console.error('❌ Even simplified Three.js failed:', initError);
                    showErrorMessage();
                }
            }
        }
        
        
        // Show error message to user
        function showErrorMessage() {
            document.getElementById('loading').innerHTML = `
                <h3>❌ Error Loading 3D Library</h3>
                <p>Failed to load Three.js from local build folder.</p>
                <p>This might be due to:</p>
                <ul style="text-align: left; max-width: 400px; margin: 10px auto;">
                    <li>Missing Three.js files in build folder</li>
                    <li>Corrupted Three.js files</li>
                    <li>Server configuration issues</li>
                    <li>File permissions problems</li>
                </ul>
                <div style="margin: 20px 0;">
                    <button onclick="location.reload()" style="padding: 10px 20px; margin: 5px; background: #ff6b6b; color: white; border: none; border-radius: 5px; cursor: pointer;">🔄 Refresh Page</button>
                    <button onclick="tryOfflineMode()" style="padding: 10px 20px; margin: 5px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">🔄 Try Offline Mode</button>
                    <button onclick="window.open('https://threejs.org', '_blank')" style="padding: 10px 20px; margin: 5px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer;">📚 Three.js Website</button>
                </div>
                <p style="font-size: 12px; opacity: 0.7;">Offline mode will use a simplified version with basic 3D functionality.</p>
                <p style="font-size: 12px; opacity: 0.7;">Make sure Three.js files exist in ./build/ folder.</p>
            `;
        }
        
        // Try offline mode with simplified Three.js
        function tryOfflineMode() {
            console.log('🔄 Trying offline mode...');
            document.getElementById('loading').innerHTML = `
                <h3>🔄 Loading Offline Mode...</h3>
                <p>Using simplified 3D library...</p>
            `;
            
            createSimplifiedThreeJs();
            
            setTimeout(() => {
                try {
                    initializeApp();
                    console.log('✅ App initialized in offline mode');
                    document.getElementById('loading').style.display = 'none';
                } catch (error) {
                    console.error('❌ Offline mode failed:', error);
                    document.getElementById('loading').innerHTML = `
                        <h3>❌ Offline Mode Failed</h3>
                        <p>Unable to initialize application.</p>
                        <button onclick="location.reload()" style="padding: 10px 20px; margin-top: 10px; background: #ff6b6b; color: white; border: none; border-radius: 5px; cursor: pointer;">🔄 Refresh Page</button>
                    `;
                }
            }, 1000);
        }
        
        // Try to initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
                // Add a longer delay to ensure Three.js scripts are loaded
                setTimeout(() => {
                    initializeAppWithThree();
                }, 500);
        });
        
        // Alternative: Also try when window is fully loaded
        window.addEventListener('load', () => {
            // Check if app is already initialized
            if (!appInitialized) {
                setTimeout(() => {
                    initializeAppWithThree();
                }, 500);
            }
        });
        
        // Alternative: Try to use a simplified version if Three.js fails
        function createSimplifiedThreeJs() {
            console.log('🔧 Creating simplified Three.js fallback...');
            
            // Create a minimal THREE object for basic functionality
            window.THREE = {
                REVISION: '165-simplified',
                Scene: function() { 
                    return { 
                        add: function() {}, 
                        remove: function() {},
                        children: [],
                        background: null
                    }; 
                },
                PerspectiveCamera: function() { 
                    return { 
                        position: { set: function() {}, x: 0, y: 0, z: 0 }, 
                        lookAt: function() {},
                        fov: 75,
                        aspect: 1,
                        near: 0.1,
                        far: 1000,
                        updateProjectionMatrix: function() {}
                    }; 
                },
                WebGLRenderer: function() { 
                    const canvas = document.createElement('canvas');
                    return { 
                        setSize: function() {}, 
                        render: function() {}, 
                        domElement: canvas,
                        shadowMap: { type: 0 }
                    }; 
                },
                BoxGeometry: function() { return {}; },
                SphereGeometry: function() { return {}; },
                CylinderGeometry: function() { return {}; },
                ConeGeometry: function() { return {}; },
                MeshBasicMaterial: function() { return { color: '#ffffff' }; },
                MeshLambertMaterial: function() { return { color: '#ffffff' }; },
                MeshPhongMaterial: function() { return { color: '#ffffff' }; },
                Mesh: function() { 
                    return { 
                        position: { set: function() {}, x: 0, y: 0, z: 0 }, 
                        rotation: { set: function() {}, x: 0, y: 0, z: 0 }, 
                        scale: { set: function() {}, x: 1, y: 1, z: 1 }, 
                        visible: true,
                        castShadow: false,
                        receiveShadow: false
                    }; 
                },
                AmbientLight: function() { return { color: '#ffffff', intensity: 1 }; },
                DirectionalLight: function() { 
                    return { 
                        position: { set: function() {}, x: 0, y: 1, z: 0 },
                        color: '#ffffff',
                        intensity: 1
                    }; 
                },
                PointLight: function() { 
                    return { 
                        position: { set: function() {}, x: 0, y: 1, z: 0 },
                        color: '#ffffff',
                        intensity: 1
                    }; 
                },
                Color: function(color) { return { r: 1, g: 1, b: 1 }; },
                GLTFLoader: function() {
                    return {
                        load: function(url, onLoad, onProgress, onError) {
                            console.log('GLTFLoader simplified - model loading skipped');
                            if (onError) onError(new Error('GLTFLoader not available in simplified mode'));
                        }
                    };
                },
                AnimationMixer: function() { return { update: function() {} }; }
            };
            
            console.log('✅ Simplified Three.js created with extended functionality');
            return window.THREE;
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            const scene = document.querySelector('#ar-scene');
            if (scene) {
                scene.resize();
            }
        });
        
        // Close gallery when clicking outside
        document.getElementById('gallery-modal').addEventListener('click', (e) => {
            if (e.target.id === 'gallery-modal') {
                closeGallery();
            }
        });
    </script>
</body>
</html>
